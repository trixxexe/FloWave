name: Build FloWave APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which builds to produce"
        required: true
        default: both
        type: choice
        options: [debug, release, both]

permissions:
  contents: write   # needed so CI can commit the corrected wrapper back once

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP 9.1.1's actual minimum is Gradle 9.3.1 (confirmed from build error, not docs).
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK components (API 36 / build-tools 36.0.0)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Always regenerate the wrapper to the correct version rather than only
      # generating "if missing" — a prior run may have committed a stale/wrong
      # version, and this makes the workflow self-correct instead of trusting it.
      - name: Ensure Gradle wrapper is on 9.3.1
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      - name: Commit wrapper if it changed
        run: |
          if [ -n "$(git status --porcelain gradlew gradlew.bat gradle/wrapper 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "chore: sync Gradle wrapper to 9.3.1 [skip ci]"
            git push
          fi

      # NOTE: this must match app/build.gradle.kts signingConfigs.debugConfig exactly:
      # file at repo ROOT named debug.keystore, alias androiddebugkey, password android.
      - name: Generate debug keystore at repo root if missing
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FloWave Debug,O=Trixx,C=IN"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowave-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowave-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore
